name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: safetrust_v2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Audit dependencies (informational)
        # Non-blocking on purpose: several current advisories only have
        # fixes via --force (breaking major-version bumps to @nestjs/cli,
        # @nestjs/schedule, @stellar/stellar-sdk) that need to be upgraded
        # and re-tested deliberately, not as a side effect of an unrelated
        # PR failing CI. This keeps the findings visible without blocking.
        run: npm audit --audit-level=high || true

      - run: npm run lint

      - run: npm run build

      - run: npm test

      - name: Run migrations
        run: npm run migrate:up
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/safetrust_v2

      - name: e2e tests
        run: npm run test:e2e
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/safetrust_v2
          ESCROW_CONTRACT_ID: CDA7WWR4AHSPQGIACBNCPG65DQZLPL3CV6NIABJFVLGPZVTUBIRQFNMF

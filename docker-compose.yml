services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: safetrust_v2
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 15

# After the DB is healthy, apply the schema with:
#   DATABASE_URL=postgres://postgres:postgres@localhost:5432/safetrust_v2 npm run migrate:up
